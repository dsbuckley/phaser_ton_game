<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Phaser Telegram TON Game</title>
  <link rel="icon" type="image/png" href="./public/favicon.png">
  <!-- Preload critical fonts for faster rendering -->
  <link rel="preload" href="/assets/fonts/LINESeedSans_A_Rg.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/assets/fonts/LINESeedSans_A_Bd.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/assets/fonts/TiltWarp-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Self-hosted fonts for optimal mobile performance */
    @font-face {
      font-family: 'LINESeed';
      src: url('/assets/fonts/LINESeedSans_A_Rg.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'LINESeed';
      src: url('/assets/fonts/LINESeedSans_A_Bd.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Tilt Warp';
      src: url('/assets/fonts/TiltWarp-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      position: fixed;
      top: 0;
      left: 0;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #game-container canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
