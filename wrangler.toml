name = "phaser-ton-game"
main = "server/index.ts"
compatibility_date = "2026-07-01"

# Static game build served from the edge; API + bot webhook hit the Worker first
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/webhook"]

[vars]
SUPABASE_URL = "https://vumzdtgmdlunhxyvvkkq.supabase.co"
# Referral share links: https://t.me/<BOT_USERNAME>/<APP_NAME>?startapp=ref_<id>
# Set these to your bot's username and Mini App short name from @BotFather.
BOT_USERNAME = "YOUR_BOT"
APP_NAME = "game"

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   TELEGRAM_BOT_TOKEN         - from @BotFather
#   SUPABASE_SERVICE_ROLE_KEY  - Supabase dashboard > Settings > API
#   TELEGRAM_WEBHOOK_SECRET    - any random string; also passed to setWebhook as secret_token
# Local dev: put the same three in .dev.vars (git-ignored), plus DEV_ALLOW_MOCK=1
